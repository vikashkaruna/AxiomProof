name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Static analysis ─────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # ─── Unit + integration tests ───────────────────────────────────
  test-ts:
    name: TS unit tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-python-runtime:
    name: Python (agent runtime) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
        working-directory: services/agent-runtime
      - run: uv run pytest --cov --cov-report=xml
        working-directory: services/agent-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-runtime
          path: services/agent-runtime/coverage.xml

  test-python-gateway:
    name: Python (model gateway) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
        working-directory: services/model-gateway
      - run: uv run pytest --cov --cov-report=xml
        working-directory: services/model-gateway

  # ─── Security scanning ──────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r services/agent-runtime/pyproject.toml || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build images ──────────────────────────────────────────────
  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [test-ts, test-python-runtime, test-python-gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE_TAG=${{ github.sha }}
          for component in web marketing bff agent-runtime model-gateway temporal-worker; do
            docker build -f infra/docker/Dockerfile.${component} \
              -t ghcr.io/axiom-minds/axiom-${component}:${IMAGE_TAG} \
              .
            docker push ghcr.io/axiom-minds/axiom-${component}:${IMAGE_TAG}
          done
