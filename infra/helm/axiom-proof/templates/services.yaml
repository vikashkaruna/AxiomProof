apiVersion: v1
kind: Service
metadata:
  name: {{ include "axiom-proof.fullname" . }}-web
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "axiom-proof.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
