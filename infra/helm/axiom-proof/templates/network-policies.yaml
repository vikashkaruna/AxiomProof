apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-default-deny
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # Default-deny all ingress; only allow specific paths.
  # Default-deny all egress; only allow specific destinations.
---
# Allow DNS egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-allow-dns
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow ingress from ingress-nginx to web and marketing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-allow-ingress
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: axiom-proof
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
# Allow service-to-service on the data plane
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-allow-internal
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: axiom-proof
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: axiom-proof
    # Allow HTTPS egress to Supabase, AWS APIs, Temporal Cloud
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # direct Postgres if used
